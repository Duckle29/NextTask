name: Pages

# Publishes the website to GitHub Pages: https://duckle29.github.io/NextTask/
# It is website/ plus the privacy policy (privacy-policy.html, linked from the Play Store listing) and
# images from branding/play, which are copied in here so they are kept in one place only.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/play-store/privacy-policy.md
      - branding/play/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the published pages
        run: |
          cp -r website site
          cp docs/play-store/privacy-policy.md site/privacy-policy.md
          mkdir site/images
          cp branding/play/icon-512.png site/images/icon.png
          cp branding/play/screenshots/1-nested-tasks.png site/images/nested-tasks.png
          cp branding/play/screenshots/3-works-offline.png site/images/works-offline.png
          cp branding/play/screenshots/5-task-lists.png site/images/task-lists.png

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: site
          destination: _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
