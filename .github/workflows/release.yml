name: Release

# Releasing = pushing a tag from main:
#
#   git tag -a v1.2.3 -m "NextTask 1.2.3"
#   git push origin v1.2.3
#
# The tag is the only place the version is written down. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version-name: ${{ steps.version.outputs.versionName }}
      version-code: ${{ steps.version.outputs.versionCode }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to see whether the tag is on main
          persist-credentials: false

      - name: The tagged commit must be on main
        run: |
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          git rev-parse --verify --quiet origin/main > /dev/null || {
            echo "::error::Cannot find origin/main."
            exit 1
          }
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $commit, which is not on main. Merge it into main and tag again."
            exit 1
          fi

      - name: Derive the version from the tag
        id: version
        run: scripts/version-from-tag.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build and sign
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The signing secrets belong to this environment, so protection rules on it (required reviewers,
    # allowed tags) decide who can make the workflow use them.
    environment: release
    env:
      VERSION_NAME: ${{ needs.verify.outputs.version-name }}
      VERSION_CODE: ${{ needs.verify.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Accept Android SDK licenses
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set; see docs/releasing.md."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Test and build the signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace \
            :shared:jvmTest :androidApp:assembleRelease :androidApp:bundleRelease \
            "-PversionName=$VERSION_NAME" "-PversionCode=$VERSION_CODE"

      - name: Check what was built
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          "$build_tools/apksigner" verify --verbose "$apk"
          badging=$("$build_tools/aapt2" dump badging "$apk" | grep '^package:')
          echo "$badging"
          if ! grep -qF "versionName='$VERSION_NAME'" <<< "$badging" || ! grep -qF "versionCode='$VERSION_CODE'" <<< "$badging"; then
            echo "::error::The APK does not carry version $VERSION_NAME ($VERSION_CODE)."
            exit 1
          fi

      - name: Collect the release files
        run: |
          mkdir release
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "release/NextTask-$VERSION_NAME.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "release/NextTask-$VERSION_NAME.aab"
          # Turns the obfuscated names in a crash report back into readable ones.
          cp androidApp/build/outputs/mapping/release/mapping.txt "release/NextTask-$VERSION_NAME-mapping.txt"
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  smoke-test:
    name: Smoke test the signed APK
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ needs.verify.outputs.version-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Accept Android SDK licenses
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      # Hardware acceleration for the emulator, which is too slow to be useful without it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Signs the exact APK about to be published in to a fake Nextcloud and checks that edits reach it.
      - name: Run the smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: scripts/smoke-test.sh "release/NextTask-$VERSION_NAME.apk"

  publish:
    name: Publish the release
    needs: [verify, build, smoke-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION_NAME: ${{ needs.verify.outputs.version-name }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Create the GitHub release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "NextTask $VERSION_NAME" \
            --generate-notes \
            "${flags[@]}"
